<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --secondary-color: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
        }

        .modes {
            display: flex;
            justify-content: space-between;
            background: var(--bg-color);
            border-radius: 0.5rem;
            padding: 4px;
            margin-bottom: 2rem;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--secondary-color);
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0.4rem;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -2px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .ctrl-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .ctrl-btn:hover {
            opacity: 0.9;
        }

        .ctrl-btn.secondary {
            background-color: transparent;
            color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="modes">
            <button class="mode-btn active" onclick="setMode('work', 25)">Work</button>
            <button class="mode-btn" onclick="setMode('shortBreak', 5)">Short Break</button>
            <button class="mode-btn" onclick="setMode('longBreak', 15)">Long Break</button>
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="controls">
            <button class="ctrl-btn" id="startBtn" onclick="toggleTimer()">Start</button>
            <button class="ctrl-btn secondary" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const modeButtons = document.querySelectorAll('.mode-btn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                startBtn.textContent = 'Start';
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        alert('Time is up!');
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = 'Start';
            const activeMode = document.querySelector('.mode-btn.active');
            activeMode.click();
        }

        function setMode(mode, minutes) {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = 'Start';
            timeLeft = minutes * 60;
            
            modeButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            updateDisplay();
        }

        updateDisplay();
    </script>

</body>
</html>
